# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                     SNAPPY SWITCHER CONFIGURATION                         ║
# ║                           CUSTOM PREMIUM THEME                            ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

[general]
# context mode groups windows by workspace+app for a cleaner grid
mode = context
follow_monitor = true
show_workspace_badge = true
sticky_mode = false
dismiss_modifier = alt

[theme]
# Using a base theme and overriding for a custom One Dark Glass look
name = snappy-slate.ini

# Premium Glassmorphism Overrides (One Dark Palette)
background = #1e222aee
card_bg = #282c34bb
card_selected = #3e4452ff
border_color = #61afefcc
text_color = #abb2bfff
subtext_color = #5c6370ff
bundle_bg = #282c34cc
badge_bg = #61afefff
badge_text_color = #282c34ff

# Modern Styling
border_width = 0
corner_radius = 8

[layout]
# Larger, more readable cards
card_width = 160
card_height = 150
card_gap = 12
padding = 15
max_cols = 6

# Enhanced Icons
icon_size = 64
icon_radius = 16

[icons]
theme = Papirus
fallback = hicolor
show_letter_fallback = true

[font]
family = JetBrainsMono Nerd Font
weight = Bold
title_size = 11
icon_letter_size = 28
